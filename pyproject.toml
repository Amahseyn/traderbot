[project]
name = "traderbot"
version = "0.1.0"
description = "Nobitex trading bot utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.31.0",
]

[project.scripts]
traderbot = "cli.root:main"
traderbot-lab = "lab.serve:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
backtest = ["vectorbt>=1.1.1", "pandas>=2.0", "numpy>=1.24"]
dev = ["pytest>=8.0", "traderbot[viz]"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traderbot*", "utils*", "lab*", "cli*", "auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: heavyweight or network-dependent tests",
]