name: CI

on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,backtest,wondertrader]"
      - name: Checkout WonderTrader (optional sibling)
        uses: actions/checkout@v4
        with:
          repository: wondertrader/wondertrader
          path: wondertrader
          sparse-checkout: |
            dist
            scripts
            src
            docs
            README.md
      - name: Pytest
        run: pytest
      - name: WonderTrader smoke
        run: |
          export WONDERTRADER_ROOT="$GITHUB_WORKSPACE/wondertrader"
          traderbot wondertrader smoke
